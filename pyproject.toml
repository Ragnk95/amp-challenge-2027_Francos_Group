[project]
name = "amp-challenge-2027-francos-group"
version = "1.0.0"
description = "Antimicrobial peptide generation from a quantum circuit Born machine prior over a learned peptide latent space."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Francos Group" }]
dependencies = [
    "numpy>=1.26,<2.0",
    "torch>=2.4",
    "pennylane>=0.38",
]

[project.scripts]
generate = "amp_challenge_2027.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_challenge_2027", "src/amp_challenger", "src/peptide_gen"]
